<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6efd" />
      <stop offset="100%" stop-color="#0052a3" />
    </linearGradient>
    
    <!-- Shield Check Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#198754" />
      <stop offset="100%" stop-color="#0f5132" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Layer (Maskable Safe Area Compatible) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Stylized Decorative Grid (Visualizing QR / Scan lines) -->
  <g opacity="0.12">
    <rect x="64" y="64" width="80" height="80" rx="10" fill="#ffffff" />
    <rect x="368" y="64" width="80" height="80" rx="10" fill="#ffffff" />
    <rect x="64" y="368" width="80" height="80" rx="10" fill="#ffffff" />
    
    <line x1="104" y1="180" x2="104" y2="330" stroke="#ffffff" stroke-width="8" stroke-dasharray="16 12" />
    <line x1="408" y1="180" x2="408" y2="330" stroke="#ffffff" stroke-width="8" stroke-dasharray="16 12" />
    <line x1="180" y1="104" x2="330" y2="104" stroke="#ffffff" stroke-width="8" stroke-dasharray="16 12" />
    <line x1="180" y1="408" x2="330" y2="408" stroke="#ffffff" stroke-width="8" stroke-dasharray="16 12" />
  </g>

  <!-- Scanner Target Overlay (Corners) -->
  <g stroke="#ffffff" stroke-width="12" fill="none" opacity="0.8">
    <!-- Top-Left -->
    <path d="M 120,160 L 120,120 L 160,120" stroke-linecap="round" />
    <!-- Top-Right -->
    <path d="M 392,160 L 392,120 L 352,120" stroke-linecap="round" />
    <!-- Bottom-Left -->
    <path d="M 120,352 L 120,392 L 160,392" stroke-linecap="round" />
    <!-- Bottom-Right -->
    <path d="M 392,352 L 392,392 L 352,392" stroke-linecap="round" />
  </g>

  <!-- Shield and Checkmark (Security, Verification, Correctness) -->
  <g filter="url(#dropShadow)">
    <!-- Shield -->
    <path d="M 256,120 
             C 320,120 370,140 370,140 
             C 370,140 370,260 256,380 
             C 142,260 142,140 142,140 
             C 142,140 192,120 256,120 Z" 
          fill="url(#shieldGrad)" />
          
    <!-- Outer White Border for Shield -->
    <path d="M 256,120 
             C 320,120 370,140 370,140 
             C 370,140 370,260 256,380 
             C 142,260 142,140 142,140 
             C 142,140 192,120 256,120 Z" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="12" 
          stroke-linejoin="round" />

    <!-- Sharp Bold Checkmark inside Shield -->
    <path d="M 206,240 L 244,278 L 310,196" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
